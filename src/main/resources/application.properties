# ===================== Application =====================
spring.application.name=task-management-system
server.port=8080

# ===================== Database (MySQL) =====================
# Create this database first: CREATE DATABASE task_management_db;
spring.datasource.url=jdbc:mysql://localhost:3306/task_management_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Kb@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / Hibernate =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================== Thymeleaf =====================
# Disable template caching so template edits show up without restarting (dev convenience)
spring.thymeleaf.cache=false

# ===================== Logging =====================
logging.level.org.springframework.security=INFO
