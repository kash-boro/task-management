<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Task - Task Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/script.js}"></script>
    <script>
        (function () {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="container">
    <h2 style="margin-bottom:20px;">Edit Task</h2>

    <div class="form-box">
        <!-- Posts back to /tasks/edit/{id} -- the id comes from the DTO's
             hidden field, pre-filled by TaskController.showEditTaskForm() -->
        <form th:action="@{/tasks/edit/{id}(id=${task.id})}" th:object="${task}" method="post" onsubmit="showSpinner()">

            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}">
                <div class="error-text" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" th:field="*{status}">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" th:field="*{priority}">
                    <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" th:field="*{category}">
                    <option value="">-- None --</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="dueDate">Due Date</label>
                <input type="date" id="dueDate" th:field="*{dueDate}">
            </div>

            <button type="submit" class="btn btn-success">Update</button>
            <a th:href="@{/tasks}" class="btn" style="background:#bbb;color:#fff;">Cancel</a>
        </form>
    </div>
</div>

<div id="spinnerOverlay" class="spinner-overlay">
    <div class="spinner"></div>
</div>

</body>
</html>
