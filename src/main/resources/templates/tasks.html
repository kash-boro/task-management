<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Tasks - Task Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/script.js}"></script>
    <script>
        (function () {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h2>My Tasks</h2>
        <div>
            <a th:href="@{/tasks/export}" class="btn" style="background:#7f8c8d;color:#fff;">Export CSV</a>
            <button type="button" class="btn btn-success" onclick="openAddModal()">+ Add Task</button>
        </div>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <!-- Search bar: matches title OR description (see TaskRepository.searchTasks) -->
    <form th:action="@{/tasks}" method="get" class="toolbar">
        <input type="text" name="keyword" placeholder="Search by title or description..."
               th:value="${keyword}" class="search-input">
        <input type="hidden" name="sortBy" th:value="${sortBy}">
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <div class="filter-bar">
        <a th:href="@{/tasks}" class="filter-btn" th:classappend="${status == null and priority == null} ? 'active'">All</a>
        <a th:href="@{/tasks(status='COMPLETED')}" class="filter-btn" th:classappend="${status != null and status.name() == 'COMPLETED'} ? 'active'">Completed</a>
        <a th:href="@{/tasks(status='PENDING')}" class="filter-btn" th:classappend="${status != null and status.name() == 'PENDING'} ? 'active'">Pending</a>
        <a th:href="@{/tasks(priority='HIGH')}" class="filter-btn" th:classappend="${priority != null and priority.name() == 'HIGH'} ? 'active'">High Priority</a>

        <form th:action="@{/tasks}" method="get" class="sort-form">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <label>Sort by:</label>
            <select name="sortBy" onchange="this.form.submit()">
                <option value="dueDate" th:selected="${sortBy == 'dueDate'}">Due Date</option>
                <option value="priority" th:selected="${sortBy == 'priority'}">Priority</option>
                <option value="createdDate" th:selected="${sortBy == 'createdDate'}">Created Date</option>
                <option value="title" th:selected="${sortBy == 'title'}">Title</option>
            </select>
        </form>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th><th>Title</th><th>Description</th><th>Status</th>
            <th>Priority</th><th>Category</th><th>Due Date</th><th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="task : ${tasks}">
            <td th:text="${task.id}"></td>
            <td th:text="${task.title}"></td>
            <td th:text="${task.description}"></td>
            <td>
                <span class="status-badge" th:classappend="'status-' + ${task.status}"
                      th:text="${taskService.statusEmoji(task.status)} + ' ' + ${task.status}"></span>
                <span class="overdue-badge" th:if="${taskService.isOverdue(task)}">OVERDUE</span>
            </td>
            <td><span class="priority-badge" th:classappend="'priority-' + ${task.priority}" th:text="${task.priority}"></span></td>
            <td th:text="${task.category} ?: '-'"></td>
            <td th:text="${task.dueDate}"></td>
            <td>
                <a th:href="@{/tasks/edit/{id}(id=${task.id})}" class="btn btn-edit">Edit</a>
                <a th:href="@{/tasks/delete/{id}(id=${task.id})}" class="btn btn-danger" onclick="return confirmDelete()">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tasks)}">
            <td colspan="8" style="text-align:center;color:#888;">No tasks match your search/filter.</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${taskPage.totalPages > 1}">
        <a th:each="i : ${#numbers.sequence(0, taskPage.totalPages - 1)}"
           th:href="@{/tasks(page=${i}, keyword=${keyword}, status=${status}, priority=${priority}, sortBy=${sortBy})}"
           th:text="${i + 1}"
           th:classappend="${i == taskPage.number} ? 'active'"
           class="page-link"></a>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<!-- ADD TASK MODAL: a dialog box instead of navigating to a separate page.
     showAddModal is set true by the controller (via flash attribute) when a
     submission fails validation, so the modal reopens with the errors shown. -->
<div id="addTaskModal" class="modal-overlay" th:classappend="${showAddModal} ? 'show'">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Add New Task</h3>
            <button type="button" class="modal-close" onclick="closeAddModal()">&times;</button>
        </div>

        <form th:action="@{/tasks/add}" th:object="${task}" method="post" onsubmit="showSpinner()">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}">
                <div class="error-text" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" th:field="*{status}">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" th:field="*{priority}">
                    <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" th:field="*{category}">
                    <option value="">-- None --</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="dueDate">Due Date</label>
                <input type="date" id="dueDate" th:field="*{dueDate}">
                <div class="error-text" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
            </div>

            <button type="submit" class="btn btn-success">Save</button>
            <button type="button" class="btn" style="background:#bbb;color:#fff;" onclick="closeAddModal()">Cancel</button>
        </form>
    </div>
</div>

<div id="spinnerOverlay" class="spinner-overlay">
    <div class="spinner"></div>
</div>

</body>
</html>
