<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Task - Task Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div>
        <span class="brand">Task Manager</span>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/tasks}">Tasks</a>
    </div>
</nav>

<div class="container">
    <h2 style="margin-bottom:20px;">Add New Task</h2>

    <div class="form-box">
        <!-- th:action posts to /tasks/add. th:object binds this form to the
             TaskDTO the controller put in the model as "task". -->
        <form th:action="@{/tasks/add}" th:object="${task}" method="post">

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}">
                <div class="error-text" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" th:field="*{status}">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
                <div class="error-text" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
            </div>

            <div class="form-group">
                <label for="dueDate">Due Date</label>
                <input type="date" id="dueDate" th:field="*{dueDate}">
            </div>

            <button type="submit" class="btn btn-success">Save</button>
            <a th:href="@{/tasks}" class="btn" style="background:#bbb;color:#fff;">Cancel</a>
        </form>
    </div>
</div>

</body>
</html>
